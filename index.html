<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codetist Live Preview</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: white;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-center: center;
      height: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      color: #666;
      background: #f5f5f5;
    }
    .empty-state-content {
      margin-top: 40vh;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="container">
    <div class="empty-state">
      <div class="empty-state-content">
        <h3>Live Preview</h3>
        <p>Open an HTML file to preview it.</p>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById('container');
    let currentPath = null;
    let pollInterval = null;
    let lastContent = null;

    // Use the native Codetist ideAPI injected by the IDE
    async function loadActiveFile() {
      if (!window.ideAPI) return;

      try {
        const activePath = await window.ideAPI.getActiveFilePath();
        
        if (!activePath) {
          showEmptyState();
          return;
        }

        // Only preview HTML files for this basic extension
        if (!activePath.endsWith('.html')) {
          showEmptyState('Open an HTML file to preview it.');
          return;
        }

        const content = await window.ideAPI.readFile(activePath);
        
        if (content !== lastContent) {
          lastContent = content;
          renderPreview(content, activePath);
        }
        
        currentPath = activePath;
      } catch (err) {
        console.error('Preview error:', err);
      }
    }

    function renderPreview(html, path) {
      // Create a blob URL to act as a proper origin for relative assets if needed
      // (Though the IDE serves relative assets through its own mechanism)
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      
      container.innerHTML = `<iframe src="${url}"></iframe>`;
    }

    function showEmptyState(msg = 'Open an HTML file to preview it.') {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-content">
            <h3>Live Preview</h3>
            <p>${msg}</p>
          </div>
        </div>
      `;
    }

    // Poll for changes every second
    // (A more advanced extension would listen to window.ideAPI.on('fileChanged'))
    pollInterval = setInterval(loadActiveFile, 1000);
    loadActiveFile();
  </script>
</body>
</html>
