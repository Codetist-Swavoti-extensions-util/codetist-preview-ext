<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Preview</title>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Local Client-Side QR Code Generator CDN -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <!-- WASM Browser Runtime CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@quickjs-wasm/core@0.27.0/dist/index.umd.js"></script>

  <style>
    :root {
      --bg-primary: #1e1e1e;
      --bg-secondary: #252526;
      --bg-input: #3c3c3c;
      --bg-hover: #2a2d2e;
      --text-main: #cccccc;
      --border-color: #383838;
      --button-hover: rgba(255, 255, 255, 0.08);
      --accent: #007acc;
      --progress-blue: #0078d4;
      --console-bg: #181818;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-primary);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Edge-style top progress bar container */
    .progress-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: transparent;
      z-index: 1000;
      pointer-events: none;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--progress-blue);
      box-shadow: 0 0 8px var(--progress-blue);
      transition: width 0.2s ease, opacity 0.3s ease;
      opacity: 0;
      border-radius: 0 2px 2px 0;
    }

    .progress-bar.active {
      opacity: 1;
    }

    .toolbar {
      position: relative;
      height: 40px;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 6px;
      user-select: none;
      z-index: 100;
      flex-wrap: nowrap;
    }

    .tool-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-main);
      height: 28px;
      padding: 0 8px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      opacity: 0.85;
      font-size: 11px;
      transition: all 0.15s ease;
      position: relative;
    }

    .tool-btn:hover {
      opacity: 1;
      background-color: var(--button-hover);
    }

    .tool-btn.active {
      background-color: rgba(255, 255, 255, 0.12);
      opacity: 1;
      color: #ffffff;
    }

    .tool-btn i, .tool-btn svg {
      width: 14px;
      height: 14px;
      stroke-width: 2;
    }

    .divider {
      width: 1px;
      height: 18px;
      background-color: var(--border-color);
      margin: 0 2px;
    }

    .address-bar-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      min-width: 120px;
    }

    .address-bar {
      width: 100%;
      height: 26px;
      background: var(--bg-input);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 0 8px;
      color: #ffffff;
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    .address-bar:focus {
      border-color: var(--accent);
    }

    .dim-badge {
      font-size: 10px;
      color: #858585;
      font-family: SFMono-Regular, monospace;
      padding: 0 6px;
      white-space: nowrap;
      height: 22px;
      display: none;
      align-items: center;
    }

    .dim-badge.visible {
      display: flex;
    }

    /* Dropdown Menu Container */
    .dropdown-wrapper {
      position: relative;
    }

    .dropdown-menu {
      position: absolute;
      top: 34px;
      left: 0;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 4px;
      display: none;
      flex-direction: column;
      gap: 2px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      z-index: 300;
      min-width: 160px;
    }

    .dropdown-menu.show {
      display: flex;
    }

    .dropdown-item {
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .dropdown-item:hover {
      background: var(--button-hover);
      color: #ffffff;
    }

    .dropdown-item.selected {
      background: var(--bg-input);
      color: #ffffff;
    }

    #viewport {
      flex: 1;
      position: relative;
      background: #181818;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 0;
    }

    .frame-container {
      width: 100%;
      height: 100%;
      transition: width 0.25s ease, height 0.25s ease;
      background: #ffffff;
      position: relative;
      border-radius: 0;
      overflow: hidden;
    }

    .frame-container.device-mobile {
      width: 390px;
      height: 844px;
      max-height: calc(100% - 16px);
      border-radius: var(--radius-lg);
      border: 8px solid #333333;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .frame-container.device-tablet {
      width: 768px;
      height: 1024px;
      max-height: calc(100% - 16px);
      border-radius: var(--radius-lg);
      border: 8px solid #333333;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    /* Console Panel Drawer */
    .console-panel {
      width: 100%;
      height: 150px;
      background: var(--console-bg);
      border-top: 1px solid var(--border-color);
      display: none;
      flex-direction: column;
      font-family: SFMono-Regular, Consolas, monospace;
      font-size: 11px;
      z-index: 50;
      border-radius: var(--radius-md) var(--radius-md) 0 0;
    }

    .console-panel.open {
      display: flex;
    }

    .console-header {
      height: 28px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      color: #aaa;
    }

    .console-logs {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-item {
      display: flex;
      gap: 8px;
      padding: 3px 6px;
      border-radius: var(--radius-sm);
      color: #cccccc;
    }

    .log-item.warn { color: #cca700; background: rgba(204, 167, 0, 0.1); }
    .log-item.error { color: #f14c4c; background: rgba(241, 76, 76, 0.1); }

    /* Modal / Popover Styling */
    .qr-modal {
      position: absolute;
      top: 46px;
      right: 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.6);
      z-index: 200;
      color: #fff;
    }

    .qr-modal.active { display: flex; }
    
    #qr-canvas {
      background: #ffffff;
      padding: 6px;
      border-radius: var(--radius-sm);
    }

    .error-overlay {
      position: absolute;
      inset: 0;
      background: rgba(24, 24, 24, 0.95);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      z-index: 20;
    }

    .error-overlay.active {
      display: flex;
    }

    .error-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .error-icon {
      width: 44px;
      height: 44px;
      color: #f14c4c;
      background: rgba(241, 76, 76, 0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .error-title {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
    }

    .error-desc {
      font-size: 12px;
      color: #a0a0a0;
      line-height: 1.5;
      word-break: break-word;
    }

    .error-retry-btn {
      margin-top: 6px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 7px 16px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .error-retry-btn:hover {
      background-color: #0062a3;
    }
  </style>
</head>
<body>

  <div class="progress-container">
    <div id="progress-bar" class="progress-bar"></div>
  </div>

  <div class="toolbar">
    <!-- Live Sync Toggle Button -->
    <button class="tool-btn active" id="btn-auto-reload" title="Toggle Live Sync on Edit">
      <i data-lucide="refresh-cw"></i>
    </button>

    <div class="divider"></div>

    <div class="address-bar-wrapper">
      <input type="text" id="address-input" class="address-bar" placeholder="about:blank" spellcheck="false">
    </div>

    <span id="dim-indicator" class="dim-badge"></span>

    <div class="divider"></div>

    <!-- Device Emulation Single Icon + Dropdown -->
    <div class="dropdown-wrapper">
      <button class="tool-btn" id="btn-device-dropdown" title="Select Device Emulation View">
        <span id="device-icon-wrapper" style="display:inline-flex; align-items:center;">
          <i data-lucide="monitor"></i>
        </span>
        <i data-lucide="chevron-down" style="width:10px; height:10px;"></i>
      </button>

      <div id="device-menu" class="dropdown-menu">
        <button class="dropdown-item selected" data-device="desktop">
          <span>Desktop View</span>
        </button>
        <button class="dropdown-item" data-device="mobile">
          <span>Mobile View</span>
          <span style="opacity:0.6; font-size:9px;">390×844</span>
        </button>
        <button class="dropdown-item" data-device="tablet">
          <span>Tablet View</span>
          <span style="opacity:0.6; font-size:9px;">768×1024</span>
        </button>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Interactive Tools -->
    <button class="tool-btn" id="btn-inspect" title="Inspect Element Tool">
      <i data-lucide="crosshair"></i>
    </button>

    <button class="tool-btn" id="btn-theme-toggle" title="Emulate Dark/Light Theme">
      <i data-lucide="sun-moon"></i>
    </button>

    <button class="tool-btn" id="btn-console" title="Toggle Console Panel">
      <i data-lucide="terminal"></i>
    </button>

    <button class="tool-btn" id="btn-qr" title="Generate Mobile Test QR Code">
      <i data-lucide="qr-code"></i>
    </button>

    <button class="tool-btn" id="btn-external" title="Open in External Browser">
      <i data-lucide="external-link"></i>
    </button>
  </div>

  <!-- QR Popover Dialog -->
  <div id="qr-modal" class="qr-modal">
    <span style="font-size: 11px; font-weight: 600;">Scan to Test on Mobile</span>
    <canvas id="qr-canvas"></canvas>
    <span id="qr-url" style="font-size: 10px; color: #858585; max-width: 180px; text-align: center; word-break: break-all;">http://localhost:3000</span>
  </div>

  <div id="viewport">
    <div id="frame-container" class="frame-container">
      <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-modals"></iframe>

      <div id="error-overlay" class="error-overlay">
        <div class="error-card">
          <div class="error-icon">
            <i data-lucide="wifi-off" style="width:22px; height:22px;"></i>
          </div>
          <div id="error-title" class="error-title">Localhost Connection Failed</div>
          <div id="error-desc" class="error-desc">Unable to reach dev server at <span id="error-url" style="color:#007acc; font-family:monospace;">localhost</span>. Verify the server is running and CORS/embedding is allowed.</div>
          <button id="btn-error-retry" class="error-retry-btn">Retry Connection</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Embedded DevTools Console -->
  <div id="console-panel" class="console-panel">
    <div class="console-header">
      <span>Console Logs</span>
      <button id="btn-clear-console" style="background:none; border:none; color:#aaa; cursor:pointer; font-size:10px;">Clear</button>
    </div>
    <div id="console-logs" class="console-logs"></div>
  </div>

  <script>
    if (window.lucide) {
      lucide.createIcons();
    }

    const frame = document.getElementById('preview-frame');
    const frameContainer = document.getElementById('frame-container');
    const addressInput = document.getElementById('address-input');
    const progressBar = document.getElementById('progress-bar');
    const dimIndicator = document.getElementById('dim-indicator');

    const errorOverlay = document.getElementById('error-overlay');
    const errorTitle = document.getElementById('error-title');
    const errorDesc = document.getElementById('error-desc');
    const errorUrl = document.getElementById('error-url');
    const btnErrorRetry = document.getElementById('btn-error-retry');
    const deviceIconWrapper = document.getElementById('device-icon-wrapper');

    // Controls
    const btnAutoReload = document.getElementById('btn-auto-reload');
    const btnDeviceDropdown = document.getElementById('btn-device-dropdown');
    const deviceMenu = document.getElementById('device-menu');
    
    const btnInspect = document.getElementById('btn-inspect');
    const btnThemeToggle = document.getElementById('btn-theme-toggle');
    const btnConsole = document.getElementById('btn-console');
    const btnQr = document.getElementById('btn-qr');
    const btnExternal = document.getElementById('btn-external');
    
    const consolePanel = document.getElementById('console-panel');
    const consoleLogs = document.getElementById('console-logs');
    const btnClearConsole = document.getElementById('btn-clear-console');
    const qrModal = document.getElementById('qr-modal');
    const qrCanvas = document.getElementById('qr-canvas');
    const qrUrlText = document.getElementById('qr-url');

    let currentPath = null;
    let lastContent = null;
    let devServerUrl = null;
    let isAutoReload = true;
    let isInspectActive = false;
    let isDarkModeEmulated = false;
    let wasmContext = null;

    function appendConsoleLog(type, text) {
      const item = document.createElement('div');
      item.className = `log-item ${type}`;
      item.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
      consoleLogs.appendChild(item);
      consoleLogs.scrollTop = consoleLogs.scrollHeight;
    }

    async function initWASMEngine() {
      try {
        if (window.QuickJS) {
          wasmContext = await window.QuickJS.getQuickJS();
          appendConsoleLog('log', '⚡ WASM Browser Runtime Ready');
        }
      } catch (err) {
        appendConsoleLog('warn', 'WASM module initialized in sandbox fallback mode');
      }
    }

    function startProgress() {
      progressBar.classList.add('active');
      progressBar.style.width = '25%';
      setTimeout(() => { progressBar.style.width = '65%'; }, 120);
      setTimeout(() => { progressBar.style.width = '85%'; }, 280);
    }

    function completeProgress() {
      progressBar.style.width = '100%';
      setTimeout(() => {
        progressBar.classList.remove('active');
        progressBar.style.width = '0%';
      }, 220);
    }

    btnDeviceDropdown.addEventListener('click', (e) => {
      e.stopPropagation();
      deviceMenu.classList.toggle('show');
    });

    document.addEventListener('click', () => {
      deviceMenu.classList.remove('show');
      qrModal.classList.remove('active');
    });

    document.querySelectorAll('.dropdown-item').forEach(item => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.dropdown-item').forEach(i => i.classList.remove('selected'));
        item.classList.add('selected');

        const device = item.dataset.device;
        setDeviceMode(device);
        deviceMenu.classList.remove('show');
      });
    });

    function setDeviceMode(mode) {
      frameContainer.classList.remove('device-mobile', 'device-tablet');

      let iconName = 'monitor';
      if (mode === 'mobile') {
        frameContainer.classList.add('device-mobile');
        dimIndicator.textContent = '390 × 844';
        dimIndicator.classList.add('visible');
        iconName = 'smartphone';
      } else if (mode === 'tablet') {
        frameContainer.classList.add('device-tablet');
        dimIndicator.textContent = '768 × 1024';
        dimIndicator.classList.add('visible');
        iconName = 'tablet';
      } else {
        dimIndicator.textContent = '';
        dimIndicator.classList.remove('visible');
        iconName = 'monitor';
      }

      if (deviceIconWrapper) {
        deviceIconWrapper.innerHTML = `<i data-lucide="${iconName}"></i>`;
        if (window.lucide) lucide.createIcons({ targets: [deviceIconWrapper] });
      }
    }

    btnConsole.addEventListener('click', () => {
      consolePanel.classList.toggle('open');
    });

    btnClearConsole.addEventListener('click', () => {
      consoleLogs.innerHTML = '';
    });

    btnAutoReload.addEventListener('click', () => {
      isAutoReload = !isAutoReload;
      btnAutoReload.classList.toggle('active', isAutoReload);
      if (isAutoReload) {
        if (devServerUrl) {
          loadDevServer(devServerUrl);
        } else if (currentPath && lastContent) {
          loadStaticDocument(currentPath, lastContent);
        }
      }
    });

    btnQr.addEventListener('click', (e) => {
      e.stopPropagation();
      qrModal.classList.toggle('active');
      const targetUrl = addressInput.value || 'http://localhost:3000';
      qrUrlText.textContent = targetUrl;
      if (window.QRCode) {
        QRCode.toCanvas(qrCanvas, targetUrl, { width: 140, margin: 1 });
      }
    });

    btnExternal.addEventListener('click', () => {
      const url = addressInput.value;
      if (url && (url.startsWith('http://') || url.startsWith('https://'))) {
        window.open(url, '_blank');
      }
    });

    btnThemeToggle.addEventListener('click', () => {
      isDarkModeEmulated = !isDarkModeEmulated;
      btnThemeToggle.classList.toggle('active', isDarkModeEmulated);
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        if (doc && doc.documentElement) {
          doc.documentElement.style.filter = isDarkModeEmulated ? 'invert(1) hue-rotate(180deg)' : 'none';
        }
      } catch (err) {
        appendConsoleLog('error', 'Cannot apply theme to cross-origin frame');
      }
    });

    btnInspect.addEventListener('click', () => {
      isInspectActive = !isInspectActive;
      btnInspect.classList.toggle('active', isInspectActive);
    });

    function showError(title, desc, url = '') {
      errorTitle.textContent = title;
      errorDesc.replaceChildren();
      const textNode = document.createTextNode(desc + ' ');
      errorDesc.appendChild(textNode);
      if (url) {
        const urlSpan = document.createElement('span');
        urlSpan.style.color = '#007acc';
        urlSpan.style.fontFamily = 'monospace';
        urlSpan.textContent = url;
        errorDesc.appendChild(urlSpan);
      }
      errorOverlay.classList.add('active');
    }

    function hideError() {
      errorOverlay.classList.remove('active');
    }

    btnErrorRetry.addEventListener('click', () => {
      hideError();
      if (devServerUrl) {
        loadDevServer(devServerUrl);
      } else if (currentPath && lastContent) {
        loadStaticDocument(currentPath, lastContent);
      }
    });

    function injectDevToolsHooks() {
      try {
        const win = frame.contentWindow;
        if (!win) return;
        
        ['log', 'warn', 'error'].forEach(level => {
          const original = win.console[level];
          win.console[level] = function (...args) {
            appendConsoleLog(level, args.join(' '));
            if (original) original.apply(win.console, args);
          };
        });
      } catch (e) {
        // Cross-origin restriction fallback
      }
    }

    async function loadStaticDocument(filePath, content) {
      startProgress();
      hideError();
      try {
        const doc = frame.contentWindow.document;
        doc.open();
        
        const baseDir = filePath.substring(0, filePath.lastIndexOf('/') + 1);
        const injectedBase = content.includes('<head>')
          ? content.replace('<head>', `<head><base href="${baseDir}">`)
          : `<base href="${baseDir}">${content}`;

        doc.write(injectedBase);
        doc.close();

        injectDevToolsHooks();
      } catch (err) {
        showError('Static Render Error', 'Failed to compile file preview.', filePath);
      } finally {
        completeProgress();
      }
    }

    async function loadDevServer(url) {
      startProgress();
      hideError();

      try {
        const response = await fetch(url, { mode: 'cors' });
        if (!response.ok) {
          throw new Error(`Server returned HTTP ${response.status}`);
        }
        let html = await response.text();

        html = html.replace(/(href|src)=["']\/(?!\/)/g, `$1="${url}/`);

        const doc = frame.contentDocument || frame.contentWindow.document;
        doc.open();
        doc.write(html);
        doc.close();

        injectDevToolsHooks();
      } catch (err) {
        try {
          frame.src = url;
          setTimeout(() => {
            try {
              if (frame.contentWindow.location.href === 'about:blank') {
                showError('Dev Server Unreachable', 'Could not establish connection to ', url);
              }
            } catch(e) {
              // Cross-origin load succeeded if origin check throws
            }
          }, 1500);
        } catch(e) {
          showError('Connection Error', 'Failed to connect to dev server at ', url);
        }
      } finally {
        completeProgress();
      }
    }

    async function updatePreview() {
      if (!window.ideAPI || !isAutoReload) return;

      try {
        if (typeof window.ideAPI.getTerminalOutput === 'function') {
          const terminalOutput = await window.ideAPI.getTerminalOutput();
          if (terminalOutput) {
            const cleanOutput = terminalOutput.replace(/\x1B\[[0-9;]*[a-zA-Z]/g, '');
            const matches = [...cleanOutput.matchAll(/http:\/\/(localhost|127\.0\.0\.1):\d+/gi)];

            if (matches.length > 0) {
              const url = matches[matches.length - 1][0];
              if (devServerUrl !== url) {
                devServerUrl = url;
                currentPath = null;
                lastContent = null;

                addressInput.value = url;
                await loadDevServer(url);
              }
              return;
            } else {
              devServerUrl = null;
            }
          }
        }

        const activePath = await window.ideAPI.getActiveFilePath();
        if (!activePath) return;

        const content = await window.ideAPI.readFile(activePath);
        if (!content) return;

        addressInput.value = activePath;

        if (content !== lastContent || activePath !== currentPath) {
          lastContent = content;
          currentPath = activePath;
          await loadStaticDocument(activePath, content);
        }
      } catch (err) {
        console.error('Preview error:', err);
      }
    }

    addressInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const value = addressInput.value.trim();
        if (value.startsWith('http://') || value.startsWith('https://')) {
          devServerUrl = value;
          loadDevServer(value);
        }
      }
    });

    initWASMEngine();
    setInterval(updatePreview, 500);
    updatePreview();
  </script>
</body>
</html>
